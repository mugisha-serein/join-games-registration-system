<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ninja Registration - Step 1</title>
  <meta name="description" content="Register to join the Ninja Family Region or play the TikTok Game. Step 1: Details.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/form.css">
</head>
<body>
  <div class="form-container">
    <div class="form-card fade-in">
      <div class="brand-header">
        <div class="brand-icon">
          <i class="fa-solid fa-user-ninja"></i>
        </div>
        <h1>Ninja Registration</h1>
        <p>Complete the steps to join the ninja ranks</p>
      </div>

      <!-- Step Progress Bar -->
      <div class="step-progress">
        <div class="progress-bar-fill"></div>
        <div class="step-node active">
          1
          <span class="step-label">Details</span>
        </div>
        <div class="step-node">
          2
          <span class="step-label">Terms</span>
        </div>
      </div>

      <!-- Form Step 1 -->
      <form id="registration-step1-form" novalidate>
        <div class="form-group">
          <label for="fullName">Full Name <span class="required">*</span></label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user input-icon"></i>
            <input 
              type="text" 
              id="fullName" 
              name="fullName" 
              class="form-control" 
              placeholder="e.g. Kenji Takahashi" 
              required
            >
          </div>
          <span class="error-msg" id="fullName-error"></span>
        </div>

        <div class="form-group">
          <label for="phoneNumber">Phone Number <span class="required">*</span></label>
          <div class="input-wrapper">
            <i class="fa-solid fa-phone input-icon"></i>
            <input 
              type="tel" 
              id="phoneNumber" 
              name="phoneNumber" 
              class="form-control" 
              placeholder="e.g. +1 555 123 4567" 
              required
            >
          </div>
          <span class="error-msg" id="phoneNumber-error"></span>
        </div>

        <div class="form-group">
          <label>Join Type <span class="required">*</span></label>
          <div class="join-type-cards">
            <!-- Ninja Family card -->
            <label class="join-type-card" for="join-family">
              <input 
                type="radio" 
                id="join-family" 
                name="joinType" 
                value="ninja_region_family" 
                required
              >
              <div class="card-icon"><i class="fa-solid fa-people-group"></i></div>
              <div class="card-title">Join Family</div>
              <div class="card-desc">Join Family Ninja Region</div>
            </label>
            
            <!-- TikTok Game card -->
            <label class="join-type-card" for="join-tiktok">
              <input 
                type="radio" 
                id="join-tiktok" 
                name="joinType" 
                value="tiktok_game" 
                required
              >
              <div class="card-icon"><i class="fa-brands fa-tiktok"></i></div>
              <div class="card-title">TikTok Game</div>
              <div class="card-desc">Join TikTok Game</div>
            </label>
          </div>
          <span class="error-msg" id="joinType-error"></span>
        </div>

        <div class="form-group">
          <label for="shortComment">Short Comment (Optional)</label>
          <textarea 
            id="shortComment" 
            name="shortComment" 
            class="form-control" 
            placeholder="Tell us why you want to join..."
            maxlength="500"
          ></textarea>
          <span class="error-msg" id="shortComment-error"></span>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="btn-next">
            <span>Next Step</span> <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/js/form.js"></script>
</body>
</html>
